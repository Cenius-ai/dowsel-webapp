[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dowsel"
version = "1.0.0"
description = "Timber joinery peg tally, end-grain boards and saw kerf reminder - a single-file, standard-library CLI."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["woodworking", "timber", "joinery", "cli", "kerf"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
dowsel = "dowsel:run_cli"

[tool.setuptools]
py-modules = ["dowsel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
